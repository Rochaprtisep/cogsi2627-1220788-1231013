# Overrides the packaged application.properties when the Bookstore runs inside the VM.

# H2 in file mode, stored in the dedicated synced folder (survives VM restarts)
spring.datasource.url=jdbc:h2:file:/home/vagrant/h2-data/bookstore
spring.datasource.username=sa
spring.datasource.password=

# Keep the schema and the data between runs
spring.jpa.hibernate.ddl-auto=update

# Allow the H2 console to be opened from the host browser (dev only)
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true