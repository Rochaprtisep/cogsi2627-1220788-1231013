# CA4 - Part 2: Bookstore in three containers  (host -> proxy -> web -> db)
# Every value comes from .env (copy .env.example; .env is never committed).
name: cogsi-ca4

services:

  # --- db: H2 in server mode; data in a named volume ---
  db:
    build:
      context: ./db
      args:
        H2_VERSION: ${H2_VERSION:-2.3.232}
    image: ${DOCKERHUB_USER:?set DOCKERHUB_USER in .env}/cogsi-ca4-db:${IMAGE_TAG:-1.0.0}
    environment:
      H2_DB_NAME: ${DB_NAME:-bookstore}
      H2_USER: ${DB_USER:?set DB_USER in .env}
      H2_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      H2_PORT: ${DB_PORT:-9092}
      H2_DATA_DIR: /var/lib/h2          # must match the volume target below
    volumes:
      - h2-data:/var/lib/h2
    networks:
      - backend
    healthcheck:
      test: ["CMD", "h2-healthcheck"]   # SELECT 1 over TCP with the application user
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
      start_interval: 2s
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped

  # --- web: Bookstore (built from CA1/part2) ---
  web:
    build:
      context: ../../CA1/part2
      dockerfile: ../../CA4/part2/web/Dockerfile   # relative to the build context
    image: ${DOCKERHUB_USER:?set DOCKERHUB_USER in .env}/cogsi-ca4-web:${IMAGE_TAG:-1.0.0}
    environment:
      SERVER_PORT: ${WEB_PORT:-8080}
      # "db" is the service name: Docker's DNS resolves it inside the backend network
      SPRING_DATASOURCE_URL: jdbc:h2:tcp://db:${DB_PORT:-9092}/${DB_NAME:-bookstore}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:?set DB_USER in .env}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      SPRING_JPA_HIBERNATE_DDLAUTO: update
      SPRING_JPA_SHOWSQL: "false"
      SPRING_H2_CONSOLE_ENABLED: "false"
      MANAGEMENT_ENDPOINT_HEALTH_SHOWCOMPONENTS: always
    depends_on:
      db:
        condition: service_healthy      # start only after the db health check passes
    networks:
      - backend
      - frontend
    healthcheck:
      # /actuator/health answers 503 when the database is DOWN, so wget fails
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:$${SERVER_PORT}/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
      start_interval: 3s
    deploy:
      resources:
        limits:
          memory: 1g
    restart: unless-stopped


networks:
  frontend: {} 
  backend:
    internal: true      # web <-> db; no route to the outside, the proxy cannot reach the db

volumes:
  h2-data: {}           # H2 files, outside the container filesystem
