version: '3.8'

services:
  # Database Service: H2 Database Server running in TCP mode
  db:
    image: oscarfonts/h2:latest
    container_name: h2-db
    restart: unless-stopped
    environment:
      # Inject database configuration and TCP options
      - H2_OPTIONS=-tcp -tcpAllowOthers -tcpPort 9092 -baseDir /opt/h2-data -ifNotExists
    volumes:
      # Persistent Docker volume to preserve database state across container lifecycles
      - h2-data:/opt/h2-data
    ports:
      - "9092:9092"
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9092 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - ca4-network

  # Web Service: Bookstore Spring Boot Application
  web:
    build:
      context: ./bookstore
      dockerfile: Dockerfile
    container_name: bookstore-web
    restart: unless-stopped
    environment:
      # Injected database credentials and connection parameters
      - DB_HOST=db
      - DB_PORT=9092
      - DB_USER=sa
      - DB_PASSWORD=
      - SPRING_DATASOURCE_URL=jdbc:h2:tcp://db:9092/opt/h2-data/bookstore
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q 'UP' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ca4-network

  # Reverse Proxy Service (completed / fine-tuned in collaboration with Person 2)
  proxy:
    image: nginx:alpine
    container_name: bookstore-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - ca4-network

volumes:
  # Named persistent volume for H2 database isolation and persistence
  h2-data:
    name: ca4_h2_data

networks:
  ca4-network:
    name: ca4_internal_network
    driver: bridge
