import org.apache.tools.ant.filters.ReplaceTokens

import java.time.OffsetDateTime
import java.time.format.DateTimeFormatter

plugins {
    id 'java'
    id 'application'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
}

group = 'com.example'
version = '1.0.0'

def appName = 'bookstore'

base {
    archivesName = appName
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation libs.bundles.spring.boot.app
    runtimeOnly libs.h2

    testImplementation libs.spring.boot.starter.test
    testRuntimeOnly libs.junit.platform.launcher
}

application {
    mainClass = 'com.example.bookstore.BookstoreApplication'
    applicationName = appName
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources) {
    def localTokens = [
            projectVersion: project.version.toString(),
            environment   : 'local',
            buildTimestamp: 'local-build'
    ]
    inputs.properties(localTokens)
    filesMatching('**/*.properties') {
        filter(ReplaceTokens, tokens: localTokens)
    }
}

def devDeployDir = layout.buildDirectory.dir('deployment/dev')

// 1. Clean the deployment directory
tasks.register('cleanDevDeployment', Delete) {
    group = 'deployment'
    description = 'Deletes the dev deployment directory.'
    delete devDeployDir
}

// 2. Copy the main application artifact
tasks.register('copyAppToDev', Copy) {
    group = 'deployment'
    description = 'Copies the application jar to the dev deployment directory.'
    dependsOn 'cleanDevDeployment'
    from tasks.named('jar')
    into devDeployDir
}

// 3. Copy only the runtime dependencies into lib/
tasks.register('copyLibsToDev', Copy) {
    group = 'deployment'
    description = 'Copies the runtime dependencies to the lib folder.'
    dependsOn 'cleanDevDeployment'
    mustRunAfter 'copyAppToDev'
    from configurations.runtimeClasspath
    into devDeployDir.map { it.dir('lib') }
}

// 4. Copy the configuration files, replacing the tokens
tasks.register('copyConfigToDev', Copy) {
    group = 'deployment'
    description = 'Copies the .properties files to the dev deployment, replacing tokens.'
    dependsOn 'cleanDevDeployment'
    mustRunAfter 'copyLibsToDev'
    notCompatibleWithConfigurationCache('The build timestamp must be recomputed on every deployment')

    def devTokens = [
            projectVersion: project.version.toString(),
            environment   : 'dev',
            buildTimestamp: OffsetDateTime.now().format(DateTimeFormatter.ISO_OFFSET_DATE_TIME)
    ]
    inputs.properties(devTokens)

    from('src/main/resources') {
        include '*.properties'
    }
    into devDeployDir
    filter(ReplaceTokens, tokens: devTokens)
}

tasks.register('deployToDev') {
    group = 'deployment'
    description = 'Deploys the jar, runtime libs and config to build/deployment/dev.'
    dependsOn 'copyAppToDev', 'copyLibsToDev', 'copyConfigToDev'
    def target = devDeployDir.get().asFile
    doLast {
        println "Bookstore deployed to: ${target}"
    }
}