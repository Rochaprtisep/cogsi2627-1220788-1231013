- name: Service account without shell or login
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ app_dir }}"
    create_home: false

- name: Application directories (releases are read-only for the service, data is writable)
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ app_user }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ app_dir }}",          owner: root,            mode: "0755" }
    - { path: "{{ app_dir }}/releases", owner: root,            mode: "0755" }
    - { path: "{{ app_dir }}/data",     owner: "{{ app_user }}", mode: "0750" }

- name: External configuration (H2 in a file inside this VM)
  ansible.builtin.template:
    src: application.properties.j2
    dest: "{{ app_dir }}/application.properties"
    owner: root
    group: "{{ app_user }}"
    mode: "0640"
  notify: Restart bookstore

- name: systemd unit
  ansible.builtin.template:
    src: bookstore.service.j2
    dest: /etc/systemd/system/bookstore.service
    mode: "0644"
  notify: Restart bookstore

- name: Enable the service at boot (it only starts once current.jar exists)
  ansible.builtin.systemd:
    name: bookstore
    enabled: true
    daemon_reload: true
