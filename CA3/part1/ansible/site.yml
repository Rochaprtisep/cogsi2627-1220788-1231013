# CA3: provisions the CA2 Part 2 VMs. Play order = dependency order (db -> app -> proxy).
- name: Baseline for every VM (packages and firewall)
  hosts: all
  become: true
  roles:
    - common

- name: Developers group, devuser and PAM password policy (app and db)
  hosts: hardened
  become: true
  roles:
    - hardening

- name: H2 database server
  hosts: db_servers
  become: true
  roles:
    - h2

- name: Bookstore application
  hosts: app_servers
  become: true
  roles:
    - bookstore

# (passo 6) Nginx