# Static inventory: the three CA2 VMs on the VirtualBox private network.
# Group names end in _servers so they never clash with the host names (db, app, proxy).
[db_servers]
db    ansible_host=192.168.56.11

[app_servers]
app   ansible_host=192.168.56.12

[proxy_servers]
proxy ansible_host=192.168.56.13

# VMs that get the developers group, devuser and the PAM password policy
[hardened:children]
db_servers
app_servers