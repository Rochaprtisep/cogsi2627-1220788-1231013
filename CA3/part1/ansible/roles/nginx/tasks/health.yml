- name: Nginx itself answers (/nginx-health, does not touch the app)
  ansible.builtin.uri:
    url: http://localhost/nginx-health
    return_content: true
  register: nginx_self
  failed_when: nginx_self.status != 200 or 'ok' not in nginx_self.content

- name: The proxy forwards to the Bookstore and the app reaches the database
  ansible.builtin.uri:
    url: http://localhost/actuator/health
    return_content: true
  register: nginx_proxied
  retries: 20
  delay: 3
  until: >-
    nginx_proxied.status | default(0) == 200 and
    nginx_proxied.json.components.db.status | default('DOWN') == 'UP'

- name: /books through the proxy returns data and the response came through Nginx
  ansible.builtin.uri:
    url: http://localhost/books
    headers:
      Host: "localhost:8080"     # what the host's browser sends through the port forwarding
    return_content: true
  register: nginx_books
  failed_when: >-
    nginx_books.status != 200 or
    nginx_books.json is not sequence or
    (nginx_books.json | length) == 0 or
    'nginx' not in (nginx_books.server | default(''))

- name: Report
  ansible.builtin.debug:
    msg: "Proxy -> app -> db OK ({{ nginx_books.json | length }} livros). Abre http://localhost:8080/books no host"