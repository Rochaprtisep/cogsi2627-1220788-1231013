- name: Install pwquality (PAM module) and pwscore (command-line checker)
  ansible.builtin.apt:
    name: [libpam-pwquality, libpwquality-tools]
    state: present
    lock_timeout: 300
  register: hardening_apt
  retries: 3
  delay: 10
  until: hardening_apt is succeeded

- name: Drop-in directory for pwquality
  ansible.builtin.file:
    path: /etc/security/pwquality.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Complexity rules (the distribution's pwquality.conf stays untouched)
  ansible.builtin.template:
    src: pwquality.conf.j2
    dest: /etc/security/pwquality.conf.d/50-ca3.conf
    owner: root
    group: root
    mode: "0644"

- name: pam-auth-update profile for the password history
  ansible.builtin.template:
    src: ca3-pwhistory.j2
    dest: /usr/share/pam-configs/ca3-pwhistory
    owner: root
    group: root
    mode: "0644"
  notify: Apply PAM profiles