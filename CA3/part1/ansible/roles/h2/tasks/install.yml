- name: Install the Java runtime (the db VM never compiles anything)
  ansible.builtin.apt:
    name: openjdk-17-jre-headless
    state: present
    lock_timeout: 300
  register: h2_apt
  retries: 3
  delay: 10
  until: h2_apt is succeeded

- name: Service account h2 (no shell, no login)
  ansible.builtin.user:
    name: "{{ h2_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ h2_data_dir }}"
    create_home: false

- name: H2 install directory
  ansible.builtin.file:
    path: "{{ h2_home }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Database directory - owner h2, group developers, no access for others
  ansible.builtin.file:
    path: "{{ h2_data_dir }}"
    state: directory
    owner: "{{ h2_user }}"
    group: "{{ developers_group }}"
    mode: "2750"

- name: Download H2 {{ h2_version }}, checked against the SHA-1 published by Maven Central
  ansible.builtin.get_url:
    url: "{{ h2_url }}"
    dest: "{{ h2_jar }}"
    checksum: "sha1:{{ h2_url }}.sha1"
    owner: root
    group: root
    mode: "0644"
  register: h2_download
  retries: 3
  delay: 5
  until: h2_download is succeeded

- name: Stable path to the jar (/opt/h2/h2.jar)
  ansible.builtin.file:
    src: "{{ h2_jar }}"
    dest: "{{ h2_home }}/h2.jar"
    state: link
  notify: Restart h2