[defaults]
inventory           = hosts.ini
remote_user         = vagrant
private_key_file    = ~/.ssh/ansible_ed25519
interpreter_python  = /usr/bin/python3
host_key_checking   = False
retry_files_enabled = False
forks               = 3

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null